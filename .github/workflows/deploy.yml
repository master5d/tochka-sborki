name: Deploy to Cloudflare

# LMS/academy/synergify/workers переехали в master5d/synergify-platform (Ф0.5 cutover 2026-08-06).
# Здесь остался личный контур mamaev.coach: hub (+blog merge) и mentor.

on:
  push:
    branches: [main]
    paths:
      - 'hub/**'
      - 'blog/**'
      - 'mentor/**'
      - '.github/workflows/deploy.yml'

env:
  CF_ACCOUNT: '252b28b0ef2e1866c532e2622060c809'

jobs:
  # ── mamaev.coach (landing hub + blog, merged build) ───────
  deploy-hub:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            blog/package-lock.json
            hub/package-lock.json
      - name: Install blog
        working-directory: blog
        run: npm ci
      - name: Build blog
        working-directory: blog
        run: npm run build
        env:
          # PUBLIC ingestion key (phc_…) — inlined into client JS by Next at build time.
          # Empty ⇒ posthog stays dark-ship (blog/lib/analytics.ts no-op). Set via repo variable.
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      - name: Install hub
        working-directory: hub
        run: npm ci
      - name: Build hub
        working-directory: hub
        run: npm run build
      - name: Merge blog into hub
        run: node scripts/merge-blog.mjs
      - name: Ensure project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          npx wrangler pages project create mamaev-coach-hub \
            --production-branch=main || echo "Project already exists"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        # A 10429 ("Rate limited") can also mean a DEAD token: Cloudflare answered the
        # token revoked on 2026-09-04 with 10429, not an auth error, and five deploys
        # failed until the repo secret was reset (2026-09-12; the next run went green
        # first try). On repeated 10429 check `gh secret list` (secret date) first.
        # This retry is only a cushion for a genuine transient throttle: it retries
        # on 10429 with backoff; any other error fails at once.
        # From hub/: wrangler ships functions/ (the cover switch) and reads
        # hub/wrangler.toml (pages_build_output_dir = ./out) only from its cwd.
        working-directory: hub
        run: |
          set -o pipefail
          for wait in 0 60 120 240; do
            sleep "$wait"
            if npx wrangler pages deploy \
                --project-name=mamaev-coach-hub \
                --branch=main \
                --commit-message="${{ github.sha }}" 2>&1 | tee deploy.log; then
              exit 0
            fi
            grep -q '10429' deploy.log || exit 1
            echo "Cloudflare rate limit (10429), retrying"
          done
          exit 1
      - name: Record published blog posts in Logos Foundry
        env:
          LOGOS_INGEST_TOKEN: ${{ secrets.LOGOS_INGEST_TOKEN }}
          LOGOS_BASE: https://logos-foundry.sovern.workers.dev
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${LOGOS_INGEST_TOKEN:-}" ]; then
            echo 'LOGOS_INGEST_TOKEN is not configured' >&2
            exit 1
          fi

          # Only newly-created post routes need a first distribution record.
          # Editing an existing post must not create duplicate rows in Foundry.
          mapfile -t slugs < <(
            git diff --name-only --diff-filter=A "$BEFORE_SHA" "$AFTER_SHA" -- 'blog/app/blog/*/page.tsx' \
              | awk -F/ 'NF == 5 { print $4 }'
          )
          if [ "${#slugs[@]}" -eq 0 ]; then
            echo 'No new blog post routes; distribution tracking is unchanged.'
            exit 0
          fi

          for slug in "${slugs[@]}"; do
            SLUG="$slug" node <<'NODE'
            const slug = process.env.SLUG;
            const base = process.env.LOGOS_BASE;
            const token = process.env.LOGOS_INGEST_TOKEN;
            const publicRes = await fetch(`${base}/api/published/${encodeURIComponent(slug)}`);
            if (!publicRes.ok) {
              throw new Error(`published lookup failed for ${slug}: HTTP ${publicRes.status}`);
            }
            const piece = await publicRes.json();
            if (!Number.isInteger(piece.id)) {
              throw new Error(`published lookup returned no numeric piece id for ${slug}`);
            }
            const url = `https://mamaev.coach/blog/${slug}/`;
            const recordRes = await fetch(`${base}/api/distributions`, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify({ pieceId: piece.id, channel: 'blog', url, status: 'published' }),
            });
            const body = await recordRes.json().catch(() => ({}));
            if (!recordRes.ok) {
              throw new Error(`distribution write failed for ${slug}: HTTP ${recordRes.status} ${body.error ?? ''}`.trim());
            }
            console.log(`Foundry distribution recorded: piece ${piece.id}, blog, published`);
            NODE
          done

  # ── mentor.mamaev.coach (B2B one-pager) ───────────────────
  deploy-mentor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mentor/package-lock.json
      - name: Install
        working-directory: mentor
        run: npm ci
      - name: Build
        working-directory: mentor
        run: npm run build
      - name: Ensure project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          npx wrangler pages project create mamaev-coach-mentor \
            --production-branch=main || echo "Project already exists"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        # A 10429 ("Rate limited") can also mean a DEAD token: Cloudflare answered the
        # token revoked on 2026-09-04 with 10429, not an auth error, and five deploys
        # failed until the repo secret was reset (2026-09-12; the next run went green
        # first try). On repeated 10429 check `gh secret list` (secret date) first.
        # This retry is only a cushion for a genuine transient throttle: it retries
        # on 10429 with backoff; any other error fails at once.
        run: |
          set -o pipefail
          for wait in 0 60 120 240; do
            sleep "$wait"
            if npx wrangler pages deploy mentor/out \
                --project-name=mamaev-coach-mentor \
                --branch=main \
                --commit-message="${{ github.sha }}" 2>&1 | tee deploy.log; then
              exit 0
            fi
            grep -q '10429' deploy.log || exit 1
            echo "Cloudflare rate limit (10429), retrying"
          done
          exit 1
